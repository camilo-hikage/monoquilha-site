<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=6, user-scalable=yes, viewport-fit=cover">
<title>Cardápio Monoquilha</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  :root{
    --stage-1:#0c1522;
    --stage-2:#050910;
    --accent:#ff7a42;
    --accent-dim:#c9602f;
    --cream:#f2e6d5;
    --muted:#7488a8;
    --muted-2:#3d4d68;
    --shadow-deep: rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}

  html{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(120% 70% at 50% -10%, #16273d 0%, transparent 60%),
      radial-gradient(160% 100% at 50% 115%, #000000 0%, transparent 55%),
      linear-gradient(180deg, var(--stage-1) 0%, var(--stage-2) 100%);
    color:var(--cream);
    font-family:"Inter", system-ui, sans-serif;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
  }

  /* faint film-grain / linen texture so the stage doesn't read flat */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.05;
    mix-blend-mode:overlay;
    background-image:
      repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, #fff 0 1px, transparent 1px 3px);
    background-size: 3px 3px;
  }

  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    padding: max(10px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    position:relative;
    z-index:1;
  }

  header{
    text-align:center;
    padding:0 0 4px;
    flex-shrink:0;
  }
  .kicker{
    font-family:"Inter",sans-serif;
    font-size:10px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
  }
  .kicker b{ color:var(--accent); font-weight:600; }
  header h1{
    margin:2px 0 0;
    font-family:"Fraunces", Georgia, serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(17px,5vw,24px);
    color:var(--cream);
    text-wrap:balance;
  }

  .book-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    min-height:0;
    /* let the book claim the whole scrollable width up to the touch chevrons */
    padding:0 34px;
  }

  .book-frame{
    position:relative;
    width:min(100%, calc(88vh * 0.7071), calc(92dvh * 0.7071));
    perspective: 2400px;
  }

  .book-shadow{
    position:absolute;
    left:50%;
    bottom:2%;
    width:min(78vw, 340px);
    height:28px;
    background: radial-gradient(50% 100% at 50% 50%, rgba(0,0,0,.55), transparent 75%);
    transform:translateX(-50%);
    filter:blur(2px);
    z-index:0;
  }

  #book{
    box-shadow: 0 30px 60px -20px var(--shadow-deep), 0 8px 20px -6px rgba(0,0,0,.5);
    border-radius:3px;
    opacity:0;
    transform:scale(.94) translateY(6px);
    animation: riseIn .7s cubic-bezier(.2,.8,.2,1) .15s forwards;
  }
  /* required page-flip library styles (not shipped in the CDN JS bundle):
     the library sizes #book itself via inline styles (autoSize), and grows
     .stf__wrapper's height with a padding-bottom aspect-ratio trick; the
     canvas fills that padding box. */
  #book .stf__wrapper{
    position:relative;
    width:100%;
    box-sizing:border-box;
  }
  #book canvas.stf__canvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:block;
    border-radius:3px;
  }
  @media (prefers-reduced-motion: reduce){
    #book{ animation:none; opacity:1; transform:none; }
  }
  @keyframes riseIn{
    to{ opacity:1; transform:scale(1) translateY(0); }
  }

  .page-face{
    background:#0c1522;
  }
  .page-face img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    -webkit-user-drag:none;
    user-select:none;
  }

  /* invisible tap zones over the book to flip with a plain tap, not just drag */
  .tap-zone{
    position:absolute;
    top:6%;
    bottom:6%;
    width:18%;
    z-index:5;
    cursor:pointer;
    background:transparent;
  }
  .tap-zone.left{ left:0; }
  .tap-zone.right{ right:0; }

  .chevron{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(12,21,34,.55);
    border:1px solid rgba(242,230,213,.14);
    color:var(--cream);
    backdrop-filter:blur(6px);
    z-index:6;
    transition:opacity .2s, transform .2s, background .2s;
  }
  .chevron:active{ transform:translateY(-50%) scale(.9); }
  .chevron.is-disabled{ opacity:.25; pointer-events:none; }
  .chevron.prev{ left:2px; }
  .chevron.next{ right:2px; }
  .chevron svg{ width:16px; height:16px; }

  footer{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding-top:14px;
  }

  .dots{
    display:flex;
    gap:7px;
  }
  .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--muted-2);
    transition:background .25s, transform .25s;
  }
  .dot.is-active{
    background:var(--accent);
    transform:scale(1.3);
  }

  .hint{
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    gap:6px;
    opacity:1;
    transition:opacity .5s ease;
  }
  .hint.is-hidden{ opacity:0; }
  .hint svg{ width:13px; height:13px; opacity:.8; }

  .counter{
    font-variant-numeric:tabular-nums;
    font-size:11px;
    color:var(--muted-2);
    letter-spacing:.05em;
  }
</style>

<div class="stage">
  <header>
    <div class="kicker">Monoquilha <b>&middot;</b> Bar &amp; Brunch</div>
    <h1>Cardápio</h1>
  </header>

  <div class="book-wrap" id="bookWrap">
    <div class="book-frame" id="bookFrame">
      <div class="book-shadow"></div>
      <div id="book"></div>
      <button class="chevron prev" id="prevBtn" aria-label="Página anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="chevron next" id="nextBtn" aria-label="Próxima página">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <footer>
    <div class="dots" id="dots"></div>
    <div class="hint" id="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 6L21 12L13 18M3 12H20" stroke-linecap="round" stroke-linejoin="round"/></svg>
      deslize ou toque nas bordas para virar a página
    </div>
    <div class="counter" id="counter">1 / 3</div>
  </footer>
</div>

  var PAGE_COUNT = IMAGES.length;

  var bookEl = document.getElementById('book');
  var dotsEl = document.getElementById('dots');
  var counterEl = document.getElementById('counter');
  var hintEl = document.getElementById('hint');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');

  for (var i = 0; i < PAGE_COUNT; i++) {
    var d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' is-active' : '');
    dotsEl.appendChild(d);
  }

  var pageFlip = new St.PageFlip(bookEl, {
    width: 400,
    height: 566,
    size: "stretch",
    minWidth: 320,
    maxWidth: 560,
    minHeight: 452,
    maxHeight: 792,
    showCover: true,
    usePortrait: true,
    maxShadowOpacity: 0.55,
    mobileScrollSupport: false,
    useMouseEvents: true,
    swipeDistance: 20,
    flippingTime: 700,
    drawShadow: true
  });

  pageFlip.loadFromImages(IMAGES);

  function updateUI(pageIndex){
    var dots = dotsEl.querySelectorAll('.dot');
    dots.forEach(function(dot, idx){ dot.classList.toggle('is-active', idx === pageIndex); });
    counterEl.textContent = (pageIndex + 1) + ' / ' + PAGE_COUNT;
    prevBtn.classList.toggle('is-disabled', pageIndex <= 0);
    nextBtn.classList.toggle('is-disabled', pageIndex >= PAGE_COUNT - 1);
    if (!hintEl.classList.contains('is-hidden')) {
      hintEl.classList.add('is-hidden');
    }
  }

  pageFlip.on('flip', function(e){ updateUI(e.data); });

  prevBtn.addEventListener('click', function(){ pageFlip.flipPrev(); });
  nextBtn.addEventListener('click', function(){ pageFlip.flipNext(); });

  // tap zones on the book edges for a plain single tap (in addition to drag-to-flip)
  var frame = document.getElementById('bookFrame');
  var leftZone = document.createElement('div');
  leftZone.className = 'tap-zone left';
  var rightZone = document.createElement('div');
  rightZone.className = 'tap-zone right';
  frame.appendChild(leftZone);
  frame.appendChild(rightZone);
  leftZone.addEventListener('click', function(){ pageFlip.flipPrev(); });
  rightZone.addEventListener('click', function(){ pageFlip.flipNext(); });

  updateUI(0);
})();
</script>

</html>
